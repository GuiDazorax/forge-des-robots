plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.forgedesrobots'
    compileSdk 34

    defaultConfig {
        applicationId "fr.forgedesrobots"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
